<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Biprodeep Bose — Full-Stack Developer and DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000"/>
      <stop offset="50%"  stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="180"/></clipPath>
  </defs>

  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift1 { from { transform: translateX(0); }    to { transform: translateX(-500px); } }
    @keyframes drift2 { from { transform: translateX(-500px); } to { transform: translateX(0); } }

    .name {
      font: 700 46px 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #ffffff; letter-spacing: 1px;
      animation: fadeUp 1s ease-out both;
    }
    .desc {
      font: 400 16px ui-monospace, SFMono-Regular, Consolas, monospace;
      fill: #9fb3c8; letter-spacing: 2.5px;
      animation: fadeUp 1s ease-out 0.35s both;
    }
    .w1 { animation: drift1 14s linear infinite; }
    .w2 { animation: drift2 20s linear infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="180" fill="url(#bg)"/>

    <!-- back wave -->
    <g class="w2" opacity="0.35">
      <path fill="url(#accent)"
        d="M0,132 c125,-26 375,26 500,0 c125,-26 375,26 500,0 c125,-26 375,26 500,0 c125,-26 375,26 500,0 L2000,180 L0,180 Z"/>
    </g>

    <!-- front wave -->
    <g class="w1" opacity="0.16">
      <path fill="#ffffff"
        d="M0,146 c125,22 375,-22 500,0 c125,22 375,-22 500,0 c125,22 375,-22 500,0 c125,22 375,-22 500,0 L2000,180 L0,180 Z"/>
    </g>

    <text class="name" x="500" y="80"  text-anchor="middle">Biprodeep Bose</text>
    <text class="desc" x="500" y="110" text-anchor="middle">FULL-STACK DEVELOPER &amp; DEVOPS ENGINEER</text>
  </g>
</svg>